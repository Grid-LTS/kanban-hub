ext {
    apacheCommonsVersion = "3.20.0"
    findbugsJsrVersion = "3.0.2"
    springBootVersion = "${springBootVersion}"
    hibernateVersion = "6.5.0.Final"
    orgImmutablesVersion = "2.12.1"
    openCSVVersion = "5.12.0"
    jacksonVersion = "2.21"
    jacksonDataBindVersion = "2.21.0"
    logbackVersion = "1.5.25"
    lombokVersion = "1.18.42"
    liquibaseVersion = "5.0.1"
    sqliteVersion = "3.51.1.0"
    sqliteDialectVersion =  "0.2.0"


supportDependencies = [
        apacheCommons : "org.apache.commons:commons-lang3:${apacheCommonsVersion}",
        findBugsJsr : "com.google.code.findbugs:jsr305:${findbugsJsrVersion}",
        jacksonDataBind : "com.fasterxml.jackson.core:jackson-databind:${jacksonDataBindVersion}",
        jackson : "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}",
        springContext : "org.springframework:spring-context",
        springBoot: "org.springframework.boot:spring-boot:${springBootVersion}",
        springBootParent : "org.springframework.boot:spring-boot-starter-parent:${springBootVersion}",
        springBootAutoConfigure : "org.springframework.boot:spring-boot-autoconfigure:${springBootVersion}",
        springBootStarterJersey : "org.springframework.boot:spring-boot-starter-jersey:${springBootVersion}",
        springBootStarterTest           : "org.springframework.boot:spring-boot-starter-test:${springBootVersion}",
        springBootStarterTomcat         : "org.springframework.boot:spring-boot-starter-tomcat:${springBootVersion}",
        springBootStarterWeb            : "org.springframework.boot:spring-boot-starter-web:${springBootVersion}",
        springBootStarterJpa            : "org.springframework.boot:spring-boot-starter-data-jpa:${springBootVersion}",
        springBootStarterSecurity       : "org.springframework.boot:spring-boot-starter-security:${springBootVersion}",
        springBootStarterActuator       : "org.springframework.boot:spring-boot-starter-actuator:${springBootVersion}",
        springSecurityOauth             : "org.springframework.security.oauth:spring-security-oauth2",
        liquibase                       : "org.liquibase:liquibase-core:${liquibaseVersion}",
        logback                         : "ch.qos.logback:logback-classic:${logbackVersion}",
        orgImmutables                   : "org.immutables:value:${orgImmutablesVersion}",
        orgImmutablesAnnotationProcessor: "org.immutables:value-processor:${orgImmutablesVersion}",
        orgImmutablesAnnotations        : "org.immutables:value-annotations:${orgImmutablesVersion}",
        orgImmutablesBuilder            : "org.immutables:builder:${orgImmutablesVersion}",
        orgImmutablesGson               : "org.immutables:gson:${orgImmutablesVersion}",
        orgImmutablesAnnotate           : "org.immutables:annotate:${orgImmutablesVersion}",
        openCSV                         : "com.opencsv:opencsv:${openCSVVersion}",
        projectLombok                   : "org.projectlombok:lombok:${lombokVersion}",
        sqlite                          : "org.xerial:sqlite-jdbc:${sqliteVersion}",
        hibernateCommunityDialects     : "org.hibernate.orm:hibernate-community-dialects:${hibernateVersion}"
        //sqliteDialect                   : "com.github.gwenn:sqlite-dialect:${sqliteDialectVersion}"
]
}
